name: Build and release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  checks:
    uses: ./.github/workflows/check.yml

  build:
    needs: checks
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows x64
            os: windows-2022
            target: x86_64-pc-windows-msvc
            rust-targets: x86_64-pc-windows-msvc
            bundles: nsis,msi
          - name: Windows x86
            os: windows-2022
            target: i686-pc-windows-msvc
            rust-targets: i686-pc-windows-msvc
            bundles: nsis,msi
          - name: Windows ARM64
            os: windows-2022
            target: aarch64-pc-windows-msvc
            rust-targets: aarch64-pc-windows-msvc
            bundles: nsis
          - name: macOS Intel
            os: macos-15-intel
            target: x86_64-apple-darwin
            rust-targets: x86_64-apple-darwin
            bundles: dmg
          - name: macOS Apple Silicon
            os: macos-15
            target: aarch64-apple-darwin
            rust-targets: aarch64-apple-darwin
            bundles: dmg
          - name: Linux x64
            os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            rust-targets: x86_64-unknown-linux-gnu
            bundles: deb,rpm,appimage
          - name: Linux ARM64
            os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            rust-targets: aarch64-unknown-linux-gnu
            bundles: deb,rpm,appimage
    env:
      CARGO_INCREMENTAL: '0'
      CARGO_TERM_COLOR: always
      MACOSX_DEPLOYMENT_TARGET: '14.0'
      APPIMAGE_EXTRACT_AND_RUN: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust-targets }}
      - name: Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential curl wget file libwebkit2gtk-4.1-dev libxdo-dev libssl-dev librsvg2-dev libayatana-appindicator3-dev patchelf desktop-file-utils
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
          key: ${{ matrix.target }}
      - run: npm ci
      - run: node scripts/check-release-version.mjs
      - run: npm run check
      - name: Build installers
        run: npx --no-install tauri build --verbose --ci --target ${{ matrix.target }} --bundles ${{ matrix.bundles }} -- --locked
      - uses: actions/upload-artifact@v4
        with:
          name: installers-${{ matrix.target }}
          if-no-files-found: error
          retention-days: 30
          compression-level: 0
          overwrite: true
          path: |
            src-tauri/target/${{ matrix.target }}/release/bundle/nsis/*.exe
            src-tauri/target/${{ matrix.target }}/release/bundle/msi/*.msi
            src-tauri/target/${{ matrix.target }}/release/bundle/dmg/*.dmg
            src-tauri/target/${{ matrix.target }}/release/bundle/deb/*.deb
            src-tauri/target/${{ matrix.target }}/release/bundle/rpm/*.rpm
            src-tauri/target/${{ matrix.target }}/release/bundle/appimage/*.AppImage

  release:
    name: Publish GitHub Release
    if: github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          pattern: installers-*
          path: installers
          merge-multiple: true
      - name: Prepare release assets
        run: |
          python3 tests/release_test.py
          python3 scripts/prepare-release.py
          cd release
          sha256sum * > SHA256SUMS.txt
      - name: Publish all installers together
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          version=$(node -p "JSON.parse(require('fs').readFileSync('package.json', 'utf8')).version")
          tag="v${version}-build.${GITHUB_RUN_NUMBER}.${GITHUB_RUN_ATTEMPT}-${GITHUB_SHA:0:7}"
          shopt -s nullglob
          for extension in exe msi deb rpm AppImage dmg; do
            matches=(release/*."$extension".zip)
            if (( ${#matches[@]} == 0 )); then
              echo "Missing installer: $extension" >&2
              exit 1
            fi
          done
          for arch in x64 aarch64; do
            matches=(release/*_"${arch}".dmg.zip)
            if (( ${#matches[@]} != 1 )); then
              echo "Expected one macOS installer for $arch" >&2
              exit 1
            fi
          done
          cat > release-notes.md <<EOF
          自动构建版本：${tag}
          应用版本：${version}
          提交：${GITHUB_SHA}
          构建记录：${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}

          安装包：Windows x64/x86/ARM64、Linux x64/ARM64、macOS 14+ Intel（x64.dmg.zip）和 Apple Silicon（aarch64.dmg.zip）。
          下载后解压即可获得以“兰谷多账号工具”命名的安装包。GitHub 不支持附件中文文件名，因此下载列表使用中文显示名称，ZIP 下载文件名仅包含版本、架构和包格式。
          SHA256SUMS.txt 提供 ZIP 校验值。当前安装包未配置发行证书签名及 macOS 公证。
          EOF
          assets=()
          while IFS= read -r asset; do
            assets+=("$asset")
          done < release-assets.txt
          gh release create "$tag" "${assets[@]}" release/SHA256SUMS.txt \
            --target "$GITHUB_SHA" \
            --title "$tag" \
            --notes-file release-notes.md \
            --draft
          gh release edit "$tag" --draft=false
          gh release view "$tag" --json url --jq .url >> "$GITHUB_STEP_SUMMARY"
